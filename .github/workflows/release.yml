name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  package:
    name: Pack verified release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(bash scripts/release-version.sh "$RELEASE_TAG")"
          expected="$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("Trexon.Web/Trexon.Web.csproj").findtext("PropertyGroup/Version"))')"
          test "$version" = "$expected" || { echo '::error::Tag and project version must match.'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::Release must be reachable from main.'; exit 1; }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Trexon.Web.slnx
      - run: dotnet build Trexon.Web.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -warnaserror
      - run: dotnet pack Trexon.Web/Trexon.Web.csproj --configuration Release --no-build --no-restore -p:ContinuousIntegrationBuild=true --output artifacts/release -warnaserror
      - run: python3 scripts/smoke-package.py --source artifacts/release
      - name: Prepare release notes and checksums
        run: |
          awk -v header="## ${GITHUB_REF_NAME#v} " '
            index($0, header) == 1 { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > artifacts/release/RELEASE-NOTES.md
          test -s artifacts/release/RELEASE-NOTES.md
          cd artifacts/release
          sha256sum ./*.nupkg ./*.snupkg > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: artifacts/release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts
      - name: Create release with verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "Trexon.Web ${RELEASE_TAG#v}" \
            --notes-file artifacts/RELEASE-NOTES.md artifacts/*.nupkg artifacts/*.snupkg artifacts/SHA256SUMS

  publish-nuget:
    name: Publish to NuGet with Trusted Publishing
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: artifacts
      - name: NuGet login with OIDC
        id: login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ vars.NUGET_USER || 'anton_aleynichenko' }}
      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --no-symbols --skip-duplicate
      - name: Publish symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  verify-publishing:
    name: Verify Trusted Publishing (no upload)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ vars.NUGET_USER || 'anton_aleynichenko' }}
